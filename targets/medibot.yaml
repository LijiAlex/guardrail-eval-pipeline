# MediBot: the role-aware retrieval assistant this pipeline watches.
# https://github.com/LijiAlex/medibot
name: medibot
adapter: medibot
endpoint: http://localhost:8000

# What MediBot can supply. Not read by any code until B3. A target that cannot supply
# passages has its grounding check and three RAGAS metrics reported as unavailable rather
# than scored zero.
#
# `contexts` needs MEDIBOT_EXPOSE_EVAL set on the target, which `./run.sh` does by
# default; `./run.sh --no-eval` turns it off, and without the envelope the passages are
# absent and grounding has nothing to work from.
capabilities:
  contexts: true
  citations: true
  token_usage: false

# The guardrail protecting this target. A path rather than a repeated name and region, so
# the policy file stays the single source for both.
guardrails:
  policy: guardrails/medibot.yaml

# principal -> the account to log in as. The KEY must be what MediBot reports as its
# `role`, because the output guardrail compares the two.
principals:
  doctor: dr.mehta
  nurse: nurse.priya
  billing_executive: billing.ravi
  technician: tech.anand
  admin: admin.sys

# MediBot's demo accounts: the password is the username plus this suffix. A target with
# real accounts would name a secret-store key instead.
auth:
  kind: jwt_login
  password_suffix: "-demo"
